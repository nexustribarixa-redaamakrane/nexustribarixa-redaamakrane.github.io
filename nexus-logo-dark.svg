    <path d="M 32 7 Q 32 32 56 32 Q 32 32 32 56 Q 32 32 8 32 Q 32 32 32 7 Z" fill="url(#starNavyGradDark1)" stroke="#00E5FF" stroke-width="1.5"/>
    <path d="M 32 18 Q 32 32 46 32 Q 32 32 32 46 Q 32 32 18 32 Q 32 32 32 18 Z" fill="url(#starCoreGlowDark1)"/>
