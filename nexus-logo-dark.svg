<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 70" width="280" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@900&amp;display=swap');
      .title-text {
        font-family: 'Noto Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 36px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      .sm-text {
        font-family: 'Noto Sans', sans-serif;
        font-weight: 900;
        font-size: 20px;
        fill: #00E5FF;
      }
    </style>

    <linearGradient id="starNavyGradDark1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#0052D4"/>
      <stop offset="75%" stop-color="#0A1931"/>
      <stop offset="100%" stop-color="#040D21"/>
