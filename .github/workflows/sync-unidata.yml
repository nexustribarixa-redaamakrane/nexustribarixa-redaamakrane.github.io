name: Sync RNUR UNIDATA mirror

on:
  # Weekly check (Monday 03:17 UTC). Runs on the default branch.
  schedule:
    - cron: '17 3 * * 1'
  # Manual trigger from the Actions tab
  workflow_dispatch:

# Only the GITHUB_TOKEN permission needed to open/update PRs.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: unidata-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Clone upstream rnur
        run: |
          rm -rf /tmp/rnur-upstream
          git clone --depth 1 https://github.com/rnur-consortium/rnur.git /tmp/rnur-upstream

      - name: Sync UNIDATA mirror
        shell: pwsh
        run: |
          ./scripts/sync-unidata.ps1 -Source /tmp/rnur-upstream

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: rnur/UNIDATA
          commit-message: 'chore: sync UNIDATA mirror from RNUR'
          branch: unidata-sync
          delete-branch: true
          title: 'chore: sync UNIDATA mirror from RNUR'
          body: |
            Auto-generated by the scheduled UNIDATA sync workflow.

            Pulls the latest `UNIDATA` data files from
            https://github.com/rnur-consortium/rnur and updates the mirror in
            `rnur/UNIDATA`. Site-specific `index.html` and `README.md` pages
            are preserved.
