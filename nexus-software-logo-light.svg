<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 70" width="540" height="70">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@900&amp;display=swap');
      .title-nexus-light {
        font-family: 'Noto Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 34px;
        fill: #040D21;
        letter-spacing: -0.5px;
      }
      .title-sub-light {
        font-family: 'Noto Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 34px;
        fill: #0052D4;
        letter-spacing: -0.5px;
      }
      .sm-text-light {
        font-family: 'Noto Sans', sans-serif;
