  <g transform="translate(4, 3)">
    <path d="M 32 3 Q 32 32 61 32 Q 32 32 32 61 Q 32 32 3 32 Q 32 32 32 3 Z" fill="url(#starNavyGradLight2)"/>
    <path d="M 32 7 Q 32 32 56 32 Q 32 32 32 56 Q 32 32 8 32 Q 32 32 32 7 Z" fill="url(#starNavyGradLight2)" stroke="#040D21" stroke-width="1.5"/>
    <circle cx="32" cy="32" r="2.5" fill="#FFFFFF"/>
  </g>

  <g transform="translate(80, 44)">
    <text x="0" y="0" class="title-nexus-light">Nexus'</text>
    <text x="130" y="0" class="title-sub-light">Software<tspan class="sm-text-light">℠</tspan></text>
