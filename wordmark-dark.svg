<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" width="600" height="80">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans:wght@900&amp;display=swap');
      
      .title-nexus {
        font-family: 'Noto Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 36px;
        fill: #FFFFFF;
        letter-spacing: -0.5px;
      }
      
      .title-sub {
        font-family: 'Noto Sans', 'Arial Black', sans-serif;
        font-weight: 900;
        font-size: 34px;
        fill: url(#cyanTextGradDark);
        letter-spacing: -0.5px;
      }
    </style>

    <!-- Blue-Navy Gradient for Four-Pointed Star -->
    <linearGradient id="starNavyGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#0052D4"/>
      <stop offset="75%" stop-color="#0A1931"/>
      <stop offset="100%" stop-color="#040D21"/>
    </linearGradient>

    <!-- Core Star Glow -->
    <radialGradient id="starCoreGlowDark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0052D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Cyan Text Gradient -->
    <linearGradient id="cyanTextGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="60%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Tricolor Gradient Accent Bar -->
    <linearGradient id="tricolorGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#FFC700"/>
    </linearGradient>

    <filter id="starGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- NO BACKGROUND RECT (Fully Transparent) -->

  <!-- Four-Pointed Star Icon (Twinkle Star) -->
  <g transform="translate(8, 5)">
    <!-- Outer aura star -->
    <path d="M 35 3 Q 35 35 67 35 Q 35 35 35 67 Q 35 35 3 35 Q 35 35 35 3 Z" fill="url(#starNavyGradDark)" filter="url(#starGlowDark)"/>
    <!-- Core star shape -->
    <path d="M 35 8 Q 35 35 62 35 Q 35 35 35 62 Q 35 35 8 35 Q 35 35 35 8 Z" fill="url(#starNavyGradDark)" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Center sparkle core -->
    <path d="M 35 20 Q 35 35 50 35 Q 35 35 35 50 Q 35 35 20 35 Q 35 35 35 20 Z" fill="url(#starCoreGlowDark)"/>
    <circle cx="35" cy="35" r="3" fill="#FFFFFF"/>
    
    <!-- Mini secondary twinkle accents -->
    <path d="M 60 12 Q 60 18 66 18 Q 60 18 60 24 Q 60 18 54 18 Q 60 18 60 12 Z" fill="#00E5FF" opacity="0.9"/>
    <path d="M 12 52 Q 12 56 16 56 Q 12 56 12 60 Q 12 56 8 56 Q 12 56 12 52 Z" fill="#FFC700" opacity="0.9"/>
  </g>

  <!-- Wordmark Text Group: Noto Sans Black -->
  <g transform="translate(90, 43)">
    <text x="0" y="0" class="title-nexus">Nexus'</text>
    <text x="135" y="0" class="title-sub">Software Wiki</text>
  </g>

  <!-- Tricolor Accent Bar & 8-Bit Pixel Edge -->
  <g transform="translate(90, 54)">
    <rect x="0" y="0" width="480" height="4" rx="2" fill="url(#tricolorGradDark)"/>
    <rect x="0" y="0" width="8" height="4" fill="#00E5FF"/>
    <rect x="235" y="0" width="8" height="4" fill="#FF3B5C"/>
    <rect x="472" y="0" width="8" height="4" fill="#FFC700"/>
  </g>
</svg>
